{% extends "base.html" %}
{% block title %}Скан #{{ scan_id }}{% endblock %}
{% block content %}
<h1>Скан #{{ scan_id }}</h1>

<div class="card">
    <p>Статус: <strong id="status">…</strong></p>
    <!-- <p>Web-порты: <strong id="web-ports">…</strong></p> -->
    <p>Ошибка: <span id="error">—</span></p>
    <p>Findings: <strong id="findings-count">0</strong> |
       Dirsearch URL: <strong id="urls-count">0</strong></p>
    <a id="report-link" href="#" class="button" style="display:none">Открыть отчёт</a>
</div>

<div class="card">
    <h2>Findings</h2>
    <table id="findings-table">
        <thead><tr><th>Тип</th><th>Severity</th><th>Title</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    window.SCAN_ID = {{ scan_id }};
</script>
{% endblock %}
